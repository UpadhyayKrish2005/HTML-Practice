<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form>
        <table border="1">

            <tr>
                <th colspan="2">Registration Form</th>
            </tr>
            <tr>
                <td>
                    <label for="Ename">Enter Name</label>
                </td>
                <td>
                    <input type="text" id="Ename" name="Ename">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="Epassword">Enter Password</label>
                </td>
                <td>
                    <input type="password" id="Epassword" name="Epassword">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="EAddress">Enter Address</label>
                </td>
                <td>
                    <textarea id="EAddress" rows="4" cols="30"></textarea>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="Game">Select Game</label>
                </td>
                <td>
                    <input type="checkbox"> Hockey <br/>
                    <input type="checkbox"> Football <br/>
                    <input type="checkbox"> Badminton <br/>
                    <input type="checkbox"> Cricket <br/>
                    <input type="checkbox"> Volleyball <br/>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="Gender">Gender</label>
                </td>
                <td>
                    <input type="radio" name = "gender" value="Male">Male 
                    <input type="radio" name = "gender" value="Female">Female
                    <input type="radio"  name = "gender" value="Other">Other
                </td>
            </tr>
            <tr>
                <td>
                    <label for="Age">Select ur age</label>
                </td>
                <td>
                    <select>
                        <option>Select</option>
                        <option>15</option>
                        <option>16</option>
                        <option>17</option>
                        <option>18</option>
                        <option>19</option>
                        <option>20</option>
                        <option>21</option>
                        <option>More than 22</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="Photo"> Select Photo</label>
                </td>
                <td>
                    <input type="file" name="Photo" id="Photo">
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <input type="button" value="Click Me">
                
                    <input type="reset" value="Reset">
                
                    <input type="submit" value="Submit Form">
                </td>
            </tr>

        </table>
    </form>
</body>

</html>
