<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="LoginForm">
            <h1>Welcome Back! 🙌</h1>
            <br>

            <p>Today is a new day. it's your day.
                you shape it. sign in to start managing your projects.
            </p>
            <br>
            <br>


            <label for="email">Email: </label><br>
            <input type="email" name="email" id="email" placeholder="Enter Your Email Address Here....">

            <br>
            <br>
            <label for="password">Password: </label><br>
            <input type="password" name="password" id="password" placeholder="Enter Your password....">

            <br>
            <br>
            <p id="para">Forget Password?</p>
            <br>
            <br>

            <button>Login Now</button>
            <br>
            <br>
            <p class="or">---------- or ----------</p>
            <br>
            <br>
            <button class="btn">
                <img src="https://www.google.com/favicon.ico" width="20" height="20" alt="Google">
                Sign in with Google
            </button>
            <br>
            <br>
            <button class="btn">
                <img src="https://www.facebook.com/favicon.ico" width="20" height="20" alt="Facebook">
                Sign in with Facebook
            </button>
        </div>
        <div class="Image">

            <img src="Login_img.png" alt="Photo">

        </div>
    </div>

</body>

</html>
